{% extends "geonode_base.html" %}
{% load i18n %}

{% block title %} {{ block.super }} {% endblock %}

{% block body_class %}catalogue catalogue-list explore{% endblock %}

{% block body %}

{% endblock %}

{% block extra_script %}
<script>
  $(function() {
    const stretchCol = () => {
      $("#catalogueList").removeClass('col-md-10 pl-5').addClass('col-md-12');
    }
    stretchCol();
    $("#sidebarFilter").on('click', function() {
      if (Modernizr.mq('(max-width: 1368px)'))
        if (!$("#sidebar").hasClass('active')) {
          stretchCol();
        } else {
          $("#catalogueList").removeClass('col-md-12').addClass('col-md-10 pl-5');
        }
    })
  })
</script>
{% endblock extra_script %}
