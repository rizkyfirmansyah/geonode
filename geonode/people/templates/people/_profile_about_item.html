{% load avatar_tags %}
{% load i18n %}

<section class="last" style="min-height:80px; background-color:var(--web-container)">
  <div class="col-xs-2">
    {% with 240 as avatar_size %}
      <div class="avatar"><a href="{% url "profile_detail" profile.username %}">{% autoescape off %}{% avatar profile avatar_size %}{% endautoescape %}</a></div>
    {% endwith %}
  </div>
  <div class="col-xs-10">
  <a href="{{ profile.get_absolute_url }}" id="btn_wrapper">{{ profile.username }}</a>
    {{ username }}
  </div>
  <div class="col-xs-9" style="margin-left: 10px;">
    <div class="details">
      <div class="meta">
        <p>
          {% if profile.organization %}{{ profile.organization }}
            {% else %}{% trans "No Group" %}
          {% endif %}</p>
      </div>
    </div>
  </div>
</section>
