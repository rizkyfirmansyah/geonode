{% verbatim %}
<div class="row row-cols-md-3 row-cols-1 ml-1 mr-1">
    <article ng-repeat="group in results[0].groups" ng-cloak class="ng-cloak p-2">
        <div class="card">
            <a ng-if="group.logo_url != ''" href="{{ group.detail_url }}"><img
                    ng-if="group.logo_url != ''" ng-src="{{ group.logo_url }}"
                    title="{{ group.title }}" class="card-img-top"/></a>
            <div class="card-body">
                <span><a href="{{ group.detail_url }}">{{ group.title }}</a></span>
                <p><small>{{ group.description | limitTo: 100 }}{{ group.description.length
                    > 100 ? '...' : ''}}</small></p>
            </div>
            <div class="card-footer">
                <ul class="row">
                    <li class="col text-center">
                        <a href="{{ group.detail_url }}">
                            <strong>{{ group.member_count }}</strong>
                            <ng-pluralize count="group.member_count"
                                            when="{'1': 'Member', 'other': 'Members'}"></ng-pluralize>
                        </a>
                    </li>
                    <li class="col text-center">
                        <a href="{{ group.detail_url }}">
                            <strong>{{ group.manager_count }}</strong>
                            <ng-pluralize count="group.manager_count"
                                            when="{'1': 'Manager', 'other': 'Managers'}"></ng-pluralize>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </article>
</div>
{% endverbatim %}
