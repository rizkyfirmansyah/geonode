{% load i18n %}
<form id="permission_form" accept-charset="UTF-8" method="post">
<div class="modal fade" id="_bulk_permissions" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title" id="myModalLabel">{% trans "Set permissions on selected resources" %}</h4>
          <button type="button" class="close col-2 float-right text-right" data-dismiss="modal" aria-label="Close">
            <i class="fa-solid fa-xmark" data-dismiss="modal"></i>
          </button>
        </div>
        <div class="modal-body text-center">
          {% include "_permissions.html" %}
        </div>
        <div class="alert hidden" id="bulk_perms_message">
          <p class="message"></p>
          <p class="extra_content"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" data-dismiss="modal">{% trans "Close" %}</button>
          <button class="btn btn-save" ng-click="bulk_perms_submit()" id="bulk_perms_submit" type="button">{% trans "Apply Changes" %}</button>
        </div>
      </div>
    </div>
</div>
</form>
{% include "_update_permissions_modal.html" %}
