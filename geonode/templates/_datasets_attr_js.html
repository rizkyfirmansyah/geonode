{% load i18n %}
{% load base_tags %}

<script type="text/javascript">

  const uri = $(location).attr('href');
  let _layers = uri.split("/")[4].split[":"]
  let _layerName = _layers[_layers.length - 1]

  const geoserverUrl = {{ GEOSERVER_OWS }}
  const workspace = {{ DEFAULT_WORKSPACE }}
  let wfsService = geoserverUrl + '?service=WFS&version=1.0.0&typeName=' + workspace + ':' + _layerName + '&outputFormat=application/json'
  let describeFeature = '&request=DescribeFeatureType'
  let getFeature = '&request=GetFeature'

  let describeFeatureUri = wfsService + describeFeature;
  $(function() {
    console.log(describeFeatureUri);
    $("#datasets").click(function() {
      $.ajax({
        type: 'GET',
        url: describeFeatureUri,
        dataType: 'json',
        success: function(data) {
          console.log(data);
        }
      }).fail(function(jqXHR, textStatus, error) {
        const message = JSON.parse(jqXHR.responseText);
        console.log(message, textStatus);
      })
    })
    
  });
</script>
