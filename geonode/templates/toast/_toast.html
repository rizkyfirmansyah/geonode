{% load i18n %}


<div class="position-fixed bottom-0 right-0 p-3" role="alert" aria-live="polite" aria-atomic="true" style="z-index: 99999; right: 0; bottom: 0;">
  <div id="liveToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true" data-delay="80000">
    <div class="toast-header">
      <strong class="mr-auto">{{ toast_title }}</strong>
      <small class="text-muted">{% now "TIME_FORMAT" %}</small>
      <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="toast-body">
      {{ toast_message }}
    </div>
  </div>
</div>
