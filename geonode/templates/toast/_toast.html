{% load i18n %}

{% if messages %}
<div id="liveToast" class="position-fixed bottom-0 right-0 p-3" style="z-index: 99999; right: 0; bottom: 0;">
  {% for message in messages %}
  <div class="toast-message {% if message.tags %}alert-{{ message.tags }}{% endif %}" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="mr-auto">{{ message.message.title }}</strong>
      <small class="text-muted">{% now "TIME_FORMAT" %}</small>
      <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    {% if message.message.message %}
    <div class="toast-body">
      <span class="font-lg-1">{{ message.message.message }}</span>
    </div>
    {% endif %}
  </div>
  {% endfor %}
  <img src="close.soon" style="display:none;" onerror="(function(el){ setTimeout(function(){ $(el).parent().remove(); }, 3000 ); })(this);" />
</div>
{% endif %}
