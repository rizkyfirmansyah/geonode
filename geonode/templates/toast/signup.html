{% load i18n %}
{% load static from staticfiles %}
{% load base_tags %}

{% block extra_script %}

<script type="text/javascript">
  $(document).ready(function() {
    
    let csrftoken = Cookies.get('csrftoken');

    $('#signup_form').submit(function(e) {
      e.preventDefault();
      $.ajax({
        data: $(this).serialize(),
        type: $(this).attr('method'),
        url: `{% url "account_signup" %}?next={{ request.path }}`,
        headers: {
          "X-CSRFToken": csrftoken
        },
        success: function(res) {
          let msg = `Sign up Successful. Please check email to verify your account {{ SITEURL }}`;
          let title = "Register";
          const $toast = toastr["success"](msg, title);
          toastr.options = {
            "newestOnTop": false,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "preventDuplicates": true
          }

        },
        error: function(xhr, desc, err) {
          console.log(err);
        }
      }).done(function() {
        setInterval('location.reload()', 1000); 
      });
      return false;
    });

  });
</script>
{% endblock extra_script %}
