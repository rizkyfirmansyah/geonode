{% load i18n %}
{% load static from staticfiles %}
{% load base_tags %}

{% block extra_script %}
<script src="{% static "lib/js/jquery.js" %}"></script>
<script type="text/javascript" src="{% static "geonode/js/base/modernizr.js" %}"></script>
<script type="text/javascript" src="{% static "geonode/js/base/pace.min.js" %}"></script>
<script type="text/javascript" src="{% static "geonode/js/base/plugins.js" %}"></script>
<script type="text/javascript" src="{% static "geonode/js/base/main.js" %}"></script>
<link rel="stylesheet" href="{% static "geonode/css/toastr.css" %}" />
<script src="{% static "geonode/js/base/toastr.js" %}"></script>
<script src="{% static "geonode/js/base/js.cookie.min.js" %}"></script>


<script type="text/javascript">
  $(document).ready(function() {
    
    let csrftoken = Cookies.get('csrftoken');

    $('#signup_form').click(function(e) {
      e.preventDefault();
      $.ajax({
        data: $(this).serialize(),
        type: $(this).attr('method'),
        url: `{% url "account_signup" %}?next={{ request.path }}`,
        headers: {
          "X-CSRFToken": csrftoken
        },
        success: function(res) {
          let msg = `Sign up Successful. Please check email for verify your account {{ SITEURL }}`;
          let title = "Register";
          const $toast = toastr["success"](msg, title);
          toastr.options = {
            "newestOnTop": false,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "preventDuplicates": true
          }

        },
        error: function(xhr, desc, err) {
          console.log(err);
        }
      }).done(function() {
        setInterval('location.reload()', 2000); 
      });
      return false;
    });

  });
</script>
{% endblock extra_script %}
