{% load i18n %}


<div class="position-fixed bottom-0 right-0 p-3" style="z-index: 99999; right: 0; bottom: 0;">
  <div id="liveToast" class="toast alert alert-info hide" role="alert" aria-live="assertive" aria-atomic="true" data-delay="5000">
    <div class="toast-header">
      <strong class="mr-auto">{{ toast_title }}</strong>
      <small class="text-muted">{% now "TIME_FORMAT" %}</small>
      <button type="button" class="ml-2 mb-1 close" onclick="document.getElementById('liveToast').remove()" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="toast-body">
      <p class="text-center text-primary" id="remaining">
        <span class="text-center text-primary">"Grab your favourite snack, coffee, or tea while waiting :)"</span>
        <div class="progress" id="prog">
          <div class="progress-bar progress-bar-success" style="width:0%"></div>
        </div>
      </p>
      <div class="spinner-grow text-info mr-3" role="status"><span class="sr-only text-center">Loading...</span></div>
      <div class="spinner-grow text-info mr-3" role="status"><span class="sr-only text-center">Loading...</span></div>
      <div class="spinner-grow text-info mr-3" role="status"><span class="sr-only text-center">Loading...</span></div>
      <div class="spinner-grow text-info mr-3" role="status"><span class="sr-only text-center">Loading...</span></div>
      <div class="spinner-grow text-info mr-3" role="status"><span class="sr-only text-center">Loading...</span></div>
    </div>
  </div>
</div>
