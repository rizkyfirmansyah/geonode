{%load i18n %}

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 5">
  <div id="passwordResetToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <img src="..." class="rounded me-2" alt="...">
      <strong class="me-auto">Reset Password</strong>
      <small>Email Sent</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      We have sent you an e-mail. Please contact us if you do not receive it within a few minutes.
    </div>
  </div>
</div>
