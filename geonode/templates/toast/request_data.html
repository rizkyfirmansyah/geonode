{% load i18n %}
{% block extra_script %}

<script type="text/javascript">
    $(function(){
      $("#request-download-layer").submit(function(t){
          t.preventDefault();let r=$(this).serialize();
          return r+="&uuid={{resource.uuid}}",r+="&resource_title={{resource.title}}",r+="&absolute_url="+$(location).attr("href"),
          $.ajax({
            data:r,type:$(this).attr("method"),method:"POST",url:"{% url 'request_permissions' %}",headers:{"X-CSRFToken":'{{csrf_token}}'},
            success:function(xhr, response, data){
              $("#request-download-layer")[0].reset()
            }
          }).done(function(){location.reload(); $(".modal").modal("hide")},!1)})
    });
</script>
{% endblock extra_script %}
