{% load i18n %}
{% load static %}
{% load base_tags %}
{% block extra_script %}
    <script type="text/javascript">
      $(document).ready(function(){
        function loadSelectItems(select, items) {
            var options = '';
            $.each(items, function(key, value) {
                options += '<option value=' + value.id + '>' + value.text + '</option>';
            });
            select.empty();
            select.append(options);
            select.selectpicker('refresh');
        }
        let data = [{id:"1 day",text:"1 day"},{id:"1 week",text:"1 week"},{id:"1 month",text:"1 month"},{id:"6 months",text:"6 months"},{id:"1 year",text:"1 year"},{id:"2 years",text:"2 years"},{id:"3 years",text:"3 years"},{id:"5 years",text:"5 years"},{id:"Forever",text:"Forever"}]
        loadSelectItems($("#retentionInput"), data);
          let e=Cookies.get("csrftoken");
          $("#request-download-layer").submit(function(t){
            t.preventDefault();let r=$(this).serialize();
            return r+="&uuid={{resource.uuid}}",r+="&resource_title={{resource.title}}",r+="&absolute_url="+$(location).attr("href"),
            $.ajax({data:r,type:$(this).attr("method"),method:"POST",url:"{% url 'request_permissions' %}",headers:{"X-CSRFToken":e},
              success:function(e){
                $(document.body).append(`{% with toast_title='Request Download' %}
                    {% with toast_message='We have sent an email to the resource owner on your request.' %}
                      {% include "toast/_toast.html" %}
                    {% endwith %}
                  {% endwith %}`);
                $('.toast').toast('show')
              ,$("#request-download-layer")[0].reset()},
              error:function(e,t,r){
                if(e.status=403){
                  $(document.body).append(`{% with toast_title='Request Error' %}
                      {% with toast_message='Please fill in the form completely.' %}
                        {% include "toast/_toast.html" %}
                      {% endwith %}
                    {% endwith %}`);
                  $('.toast').toast('show')
                }else{
                  $(document.body).append(`{% with toast_title='Request Error' %}
                      {% with toast_message='Something is wrong. Apologies and please ask directly to the resource owner.' %}
                        {% include "toast/_toast.html" %}
                      {% endwith %}
                    {% endwith %}`);
                  $('.toast').toast('show')
              }}}).done(function(){$(".modal").modal("hide")}),!1})});</script>
{% endblock extra_script %}
