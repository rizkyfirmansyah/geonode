{% load i18n %} {% load static from staticfiles %} {% load base_tags %} {% load layer_tags %} {% block extra_script %}

<script type="text/javascript">
    $(document).ready(function() {

        let csrftoken = Cookies.get('csrftoken');

        $('#remove_layer').submit(function(e) {
            resource_title = '{{ resource.title }}';
            layername = '{{ resource.layer.service_typename }}';
            e.preventDefault();

            $.ajax({
                data: {
                    'layername': layername
                },
                type: $(this).attr('method'),
                method: 'POST',
                url: `{% url "layer_remove" %}`,
                headers: {
                    "X-CSRFToken": csrftoken
                },
                success: function(res) {
                    let msg = "Your " + resource_title + " has been deleted.";
                    let title = "Delete Resource";
                    const $toast = toastr["success"](msg, title);
                    toastr.options = {
                        "newestOnTop": false,
                        "progressBar": true,
                        "positionClass": "toast-top-right",
                        "preventDuplicates": true
                    }
                }
            }).done(function() {
                setInterval(function() {
                    location.href = "{% url 'layer_browse' %}";
                }, 1000);
            });
            return false;
        });

    });
</script>
{% endblock extra_script %}
