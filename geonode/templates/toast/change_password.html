{% load i18n %}{% load static %}{% load base_tags %}{% block extra_script %}<script type="text/javascript">$(document).ready(function(){let e=Cookies.get("csrftoken");$("#change-password").submit(function(t){return t.preventDefault(),$.ajax({data:$(this).serialize(),type:$(this).attr("method"),method:"POST",url:"{% url 'account_change_password' %}",headers:{"X-CSRFToken":e},error:function(e,t,o){let r=JSON.parse(e.responseText).form.fields.password1.errors[0];toastr.error(r,"Can't Reset Your Password");toastr.options={newestOnTop:!1,progressBar:!0,positionClass:"toast-top-right",preventDuplicates:!0}}}).done(function(){setInterval("location.reload()",1e3)}),!1})});</script>{% endblock extra_script %}
