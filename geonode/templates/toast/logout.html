{% load i18n %}
{% load static from staticfiles %}
{% load base_tags %}

{% block extra_script %}
<script src="{% static "geonode/js/base/js.cookie.min.js" %}"></script>

<script type="text/javascript">
  $(document).ready(function() {

    // get token from js cookie
    const _user ='{{ user.is_authenticated }}';
    let csrftoken = Cookies.get('csrftoken');
    console.log(_user);

    if (_user != 'False') {
      $('#logged-out').hover(function() {
        const $this = $(this);
        $this
          .data('users', $this.text())
          .text("Logged out?");
      }, function() {
        const $this = $(this);
        $this.text($this.data('users'));
      });
    }

    $('#logged-out').click(function(e) {
      e.preventDefault();
      $.ajax({
        data: $(this).serialize(),
        type: $(this).attr('method'),
        url: `{% url "account_logout" %}?next={{ SITEURL }}`,
        headers: {
          "X-CSRFToken": csrftoken
        },
        success: function(res) {
          let msg = "You have been successfully logout";
          let title = "Logout";
          const $toast = toastr["success"](msg, title);
          toastr.options = {
            "newestOnTop": false,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "preventDuplicates": true
          }

        },
        error: function(xhr, desc, err) {
          console.log(err);
        }
      }).done(function() {
        setInterval('location.reload()', 2000); 
      });
      return false;
    });

  });
</script>
{% endblock extra_script %}
