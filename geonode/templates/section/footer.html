{% load i18n %}
{% load static from staticfiles %}

<footer class="col-lg-12">
    <div class="logo col-md-6">
      <figure class="logo-image">
        <img src="{% if custom_theme.logo_footer %}uploaded/{{ custom_theme.jumbotron_bg }} {% else %} {% static "geonode/img/logo-footer.png" %} {% endif %}" class="logo-footer">
      </figure>
    </div>
    <div class="col-md-6">
        <div class="col-lg-12 text-right" id="right-footer" style="background-color: transparent;">
          <ul id="menu-footer-nav-copyright" class="list-inline">
            <li class="list-inline-item menu-item">
              <a href="{% url 'privacy-policy' %}" role="button">Privacy policy</a></li>
            <li class="list-inline-item">
              {% if csrf_token != "NOTPROVIDED" %}
              {% get_current_language as LANGUAGE %}
              <form class="form-inline" action="/i18n/setlang/" method="post">
              {% csrf_token %}
                <select id="footer-language" class="primary-text-white" name="language" onchange="javascript:form.submit()">
                  {% for lang in LANGUAGES %}
                  <option value="{{ lang.0 }}" {% ifequal LANGUAGE_CODE lang.0 %} selected="selected"{% endifequal %}>
                    {{ lang.1 }}
                  </option>
                  {% endfor %}
                </select>
              </form>
              {% endif %}
            </li>
          </ul>
          <ul id="menu-footer-nav-copyright" class="list-inline">
            <li class="list-inline-item"><span class="copyright-text">© Accountability Framework 2022</span></li>
            <li class="list-inline-item"><span class="copyright-text">|&nbsp;&nbsp;&nbsp;Powered by Geonode.</span></li>
          </ul>
        </div>
    </div>
</footer>
