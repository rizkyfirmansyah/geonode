{% load i18n %}

<div class="mt-3 w-100">
  <form class="autocomplete-input input-group" id="text-search-autocomplete">
    {% csrf_token %}
    <div id="text-search-container" class="w-100">
      <div class="row rounded-pill bg-web" id="search_header">
        <span>
          <button class="btn" type="submit" id="text_search_btn"><i class="fa-solid fa-search"></i></button>
        </span>
        <div class="col d-inline-grid p-0">
          <input autocomplete="off" ng-model="text_query" type="text" name="text_search_input" class="w-100" id="text_search_input"
            placeholder="{% trans 'Search' %}">
        </div>
        <div aria-label="Delete" role="button" class="delete_search mr-3"><span class="dlt_span" role="button" tabindex="0"
            aria-label="Delete" title="Delete"><svg focusable="false" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
              </path>
            </svg></span></div>
      </div>
      <span class="input-highlight"></span>
    </div>
  </form>
</div>

{% block extra_script %}
<script text="text/javascript">
  $(function () {

    $('#jump_to_top').hide();
    $(window).scroll(function () {
      if ($(document).scrollTop() > 700) {
        $('#jump_to_top').show();
        $('#jump_to_top').animate({
          scrollTop: 0
        }, 'fast');
      } else {
        $('#jump_to_top').hide();
      }
    });
    $("#jump_to_top").click(function () {
      $('html, body').animate({
        scrollTop: 0
      }, 'fast');
    });

    $("#text_search_input").on("change keyup paste click", function () {
      let _length = $("#text_search_input").val().length;
      let _width = (_length * .54) + 'em';
      if (_length > 0) {
        $(".input-highlight").css("width", _width);
      } else {
        $(".input-highlight").css("width", '0em');
      }
    });

    var getUrlParameter = function getUrlParameter(sParam) {
      var sPageURL = window.location.search.substring(1),
        sURLVariables = sPageURL.split('&'),
        sParameterName,
        i;

      for (i = 0; i < sURLVariables.length; i++) {
        sParameterName = sURLVariables[i].split('=');

        if (sParameterName[0] === sParam) {
          return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
        }
      }
      return false;
    };

    var title = getUrlParameter('title__icontains');

    if (title) {
      $("#text_search_input").val(title);
    }

    $(".delete_search").click(function () {
      $("#text_search_input").val('');
      $(".result-wrapper").css('display', 'none');
      $(".input-highlight").css("width", '0em');
    });

  });
</script>
{% endblock %}
