{% load i18n %}
{% load thesaurus %}

{% if SEARCH_FILTERS.OWNERS_ENABLED %}
  {% verbatim %}
  <label class="pl-2 mb-0 font-weight-bold">Responsibles</label>
  <select title="Select Owners" class="form-select selectpicker mb-2 remove-select" id="owners" multiple data-live-search="true" data-size="10" data-width="100%" data-container="body" data-actions-box="true" data-deselect-all-text="Deselect">
    <option ng-repeat="owner in owners" ng-if="owner.count > 0" data-content="
        <span class='d-none'>{{ owner.username }}</span>
        <span class='badge badge-secondary w-auto d-inline' style='font-size: .9em;'>{{ owner.full_name ? owner.full_name : owner.username }}</span><span class='small span_count float-right'>{{ owner.count }}</span>">
    </option>
  </select>
  {% endverbatim %}
{% endif %}

{% block extra_script %}
<script type="text/javascript">
  $(function() {

    $("#owners").on("changed.bs.select", function(e, clickedIndex, previousValue) {
        $('.filter-option-inner-inner .span_count').remove();

        var selected = [];
        $(".filter-option-inner-inner span.d-none" ).each(function() {
            selected.push($( this ).text())
        });
        
        if (selected) {
            angular.element("body").scope().multiple_choice_listener(e, selected);
        }
    });

  })
</script>
{% endblock extra_script %}
