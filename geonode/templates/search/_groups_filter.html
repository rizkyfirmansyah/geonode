{% load i18n %}
{% load thesaurus %}

{% if SEARCH_FILTERS.GROUPS_ENABLED %}
  {% verbatim %}
  <label class="pl-2 mb-0 font-weight-bold">Groups</label>
  <select title="Select Groups" class="form-select selectpicker mb-2 remove-select" id="groups" multiple data-live-search="true" data-size="10" data-width="100%" data-container="body" data-actions-box="true" data-deselect-all-text="Deselect">
    <option ng-repeat="group in groups" ng-if="group.resource_counts.layer.total > 0 || group.resource_counts.document.total > 0" data-content="
        <span class='d-none'>{{ group.name }}</span>
        <span class='badge badge-secondary w-auto d-inline' style='font-size: .9em;'>{{ group.group_profile.title }}</span><span class='small span_count float-right'>{{ group.resource_counts.all.total }}</span>">
    </option>
  </select>
  {% endverbatim %}
{% endif %}

{% block extra_script %}
<script type="text/javascript">
  $(function() {

    $("#groups").on("changed.bs.select", function(e, clickedIndex, previousValue) {
        $('.filter-option-inner-inner .span_count').remove();

        var selected = [];
        $(".filter-option-inner-inner span.d-none" ).each(function() {
            selected.push($( this ).text())
        });
        
        if (selected) {
            angular.element("body").scope().multiple_choice_listener(e, selected);
        }
    });

  })
</script>
{% endblock extra_script %}
