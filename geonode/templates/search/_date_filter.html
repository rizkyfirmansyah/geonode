{% load i18n %}

<nav class="filter" ng-cloak>
  <a href="#date_filter" data-toggle="collapse" aria-expanded="false" class="dropdown-toggle nav-toggle">Date</a>
  <ul class="collapse list-unstyled" id="date_filter">
      <ul class="nav" id="date_start">
          <div class="p-2">
              <label>{% trans "Date begins after:" %}</label>
              <div class="row">
                  <div class="col-9 pr-0">
                      <input value="yyyy-mm-dd" data-date-format="YYYY-MM-DD" type="text" class="form-control datetimepicker-input" data-toggle="datetimepicker" data-target="#inpDate1"
                          placeholder="{% trans 'yyyy-mm-dd' %}" ng-model="date_query.date__gte" id="inpDate1" />
                  </div>
                  <div aria-label="Delete" role="button" class="col-2" id="dltDate1"><span
                          class="dlt_span" role="button" tabindex="0" aria-label="Delete" title="Delete"><svg
                              focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                              <path
                                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                              </path>
                          </svg></span></div>
              </div>
          </div>
      </ul>
      <ul class="nav" id="date_end">
          <div class="p-2">
              <label>{% trans "Date ends before:" %}</label>
              <div class="row">
                  <div class="col-9 pr-0">
                      <input value="yyyy-mm-dd" data-date-format="YYYY-MM-DD" type="text" class="form-control datetimepicker-input" data-toggle="datetimepicker" data-target="#inpDate2"
                          placeholder="{% trans 'yyyy-mm-dd' %}" ng-model="date_query.date__lte" id="inpDate2" />
                  </div>
                  <div aria-label="Delete" role="button" class="col-2" id="dltDate2"><span
                          class="dlt_span" role="button" tabindex="0" aria-label="Delete" title="Delete"><svg
                              focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                              <path
                                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                              </path>
                          </svg></span></div>
              </div>
          </div>
      </ul>
  </ul>
</nav>
