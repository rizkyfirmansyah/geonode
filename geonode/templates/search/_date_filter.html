{% load i18n %}

<nav class="filter" ng-cloak>
  <a href="#date_start" data-toggle="collapse" aria-expanded="false" class="dropdown-toggle nav-toggle">Date</a>
  <ul class="collapse list-unstyled" id="date_start">
      <label>{% trans "Date begins after:" %}</label>
      <div>
          <input value="yyyy-mm-dd" data-date-format="YYYY-MM-DD" type="text" class="datepicker"
              placeholder="{% trans 'yyyy-mm-dd' %}" ng-model="date_query.date__gte" id="inpDate1" />
          <div aria-label="Delete" role="button" class="delete_search delete_date" id="dltDate1"><span
                  class="dlt_span" role="button" tabindex="0" aria-label="Delete" title="Delete"><svg
                      focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path
                          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                      </path>
                  </svg></span></div>
      </div>
  </ul>
  <ul class="collapse list-unstyled" id="date_end">
      <label>{% trans "Date ends before:" %}</label>
      <div>
          <input value="yyyy-mm-dd" data-date-format="YYYY-MM-DD" type="text" class="datepicker"
              placeholder="{% trans 'yyyy-mm-dd' %}" ng-model="date_query.date__lte" id="inpDate2" />
          <div aria-label="Delete" role="button" class="delete_search delete_date" id="dltDate2"><span
                  class="dlt_span" role="button" tabindex="0" aria-label="Delete" title="Delete"><svg
                      focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path
                          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                      </path>
                  </svg></span></div>
      </div>
  </ul>
</nav>
