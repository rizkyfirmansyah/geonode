{% load i18n %}

<nav class="filter" ng-cloak>
    <a href="#region_filter" data-toggle="collapse" aria-expanded="false" class="dropdown-toggle nav-toggle">Regions</a>
    <ul class="collapse list-unstyled" id="region_filter">
        <form class="autocomplete-input input-group p-2" id="region-search-autocomplete">
            {% csrf_token %}
            <div id="region-search-container" class="row w-100">
                <div class="col-10 pr-0">
                    <input autocomplete="off" type="text" name="region_search_input" class="w-100 p-2"
                        id="region_search_input" placeholder="{% trans "Search by region" %}">
                </div>
                <div class="col-2">
                    <button id="region_search_btn" aria-label="Filter data" type="submit">
                        <span class="fltSpTree">
                            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                                </path>
                            </svg>
                        </span>
                </div>
            </div>
        </form>
    </ul>
</nav>
