{% load i18n %}

<div class="col" ng-controller="CartList">
  <h3 class="text-primary">
    <span ng-bind="total_counts + ' {{ facet_type | title }} {% trans "found" %}'"></span>
  </h3>
</div>
{% if facet_type == 'maps' %}
  {% if user.is_authenticated and not READ_ONLY_MODE %}
    <div class="col-md-2 text-right d-flex"><a href="{% url "new_map" %}" class="btn btn-save d-flex align-items-center">{% trans "Create a New Map" %}</a></div>
  {% endif %}
{% endif %}
<button class="btn btn-primary sidebar-toggle col-md-2" id="sidebarFilter" aria-haspopup="true" aria-expanded="false">Filter</button>
{% include "search/_sort_filters.html" %}
{% include "modal/bulk_permissions.html" %}
