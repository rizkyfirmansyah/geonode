{% load base_tags %}
{% load i18n %}

<script type="text/javascript">
  {% get_context_resourcetype as pathc %}

  {% if pathc == "people" %}
    {% if HAYSTACK_SEARCH %}
      SEARCH_URL = '{% url 'api_get_search' api_name='api' resource_name='profiles'%}'
    {% else %}
      SEARCH_URL = '{% url 'api_dispatch_list' api_name='api' resource_name='profiles' %}';
    {% endif %}

  {% elif pathc == "groups" %}
      SEARCH_URL = '{% url 'api_dispatch_list' api_name='api' resource_name='profiles' %}'+ '?group='+ '{{ object.slug }}';

  {% elif pathc == "groups/categories" %}
      SEARCH_URL = '{% url 'api_dispatch_list' api_name='api' resource_name='groups' %}'+ '?group_profile__categories__slug='+ '{{ object.slug }}';
      
  {% else %}
    {% if HAYSTACK_SEARCH %}
      SEARCH_URL = '{% url 'api_get_search' api_name='api' resource_name='base'%}'
    {% else %}
      SEARCH_URL = '{% url 'api_dispatch_list' api_name='api' resource_name='base' %}';
    {% endif %}
  {% endif %}

</script>

{% include 'search/search_scripts.html' %}
