{% if messages %}
<div class="system_messages">
    {% for message in messages %}
    <div class="alert alert-block announcement {% if message.tags %}alert-{{message.tags}}{% else %}alert-warning{% endif %}" role="alert" aria-live="assertive" aria-atomic="true">
        <a type="button" class="close" data-dismiss="alert" data-dismiss-url="#" href="#">×</a>
            <p{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>
    </div>
    {% endfor %}
</div>
{% endif %}
