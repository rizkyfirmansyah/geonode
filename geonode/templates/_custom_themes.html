<style type="text/css">
  :root {
    --font-small: 0.8em;
    --font-larger-1: 1.2em;
    --font-larger-2: 1.7em;
    --web-surface: #F0F2F5;
    --web-container: white;
    --shadow-1: #ccc;
    --border-radius-sm: 0.5em;
    --border-radius-md: 0.75em;
    --border-radius-fix-lg: 50px;
    --header-height: 80px;
    --header-height-min: -80px;
    --padding-link-header: .6em;
    --search-header: 3em;
    --spacing-1: 2.5em;
    --relative-space-header: 4em;
    --secondary-theme-color: #3abce4;
    --toggle: #e0e8e7;
    --save: #256BF4;
    --upload: #4F98AF !important;
    --primary: #1D4842 !important;
    --secondary: #fff !important;
    --success: #4F98AF !important;
    --warning: #a23133 !important;
    --link: #fdba12 !important;
    --danger: #000 !important;
    --disabled: #c4c4c4 !important;
    --edit: #fdba12 !important;
    --download: #58c2ff !important;
  }
  {% if custom_theme.body_text_color %}
  body {
    {% if custom_theme.body_text_color %}
    color: {{ custom_theme.body_text_color }};
    {% endif %}
  }
  {% endif %}

  {% if custom_theme.navbar_color %}
  .home .navbar-inverse , .navbar-inverse {
    background-color: {{ custom_theme.navbar_color }};
  }
  {% endif %}

  {% if custom_theme.header_bg_color %}
  .s-header {
    background-color: {{ custom_theme.header_bg_color }} !important;
  }
  {% endif %}

  {% if custom_theme.showcase_bg_color %}
  #showcase {
    background-color: {{ custom_theme.showcase_bg_color }} !important;
  }
  {% endif %}
  
  {% if custom_theme.showcase_text_color %}
  #showcase .container div,
  #showcase .container ul,
  #showcase .container ol,
  #showcase .container li,
  #showcase .container h1,
  #showcase .container h2,
  #showcase .container h3,
  #showcase .container h4,
  #showcase .container h5,
  #showcase .container h6,
  #showcase .container pre,
  #showcase .container p {
      color: {{ custom_theme.showcase_text_color }} !important;
  }
  {% endif %}

  {% if custom_theme.showcase_text_link_color %}
  #showcase .container a {
      color: {{ custom_theme.showcase_text_link_color }} !important;
  }
  {% endif %}

  {% if custom_theme.navbar_text_color %}
  .navbar-inverse .navbar-nav > li > a {
    color: {{ custom_theme.navbar_text_color }};
    font-weight: 600;
    padding-top: 25px;
    padding-bottom: 25px;
  }
  {% endif %}

  {% if custom_theme.navbar_text_hover %}
  .navbar-inverse .navbar-nav > li > a:hover {
    background-color: {{ custom_theme.navbar_text_hover }};
  }
  {% endif %}

  {% if custom_theme.navbar_text_hover_focus %}
  .navbar-inverse .navbar-nav > .open > a,
  .navbar-inverse .navbar-nav > .open > a:hover,
  .navbar-inverse .navbar-nav > .open > a:focus {
    background-color: {{ custom_theme.navbar_text_hover_focus }};
  }
  {% endif %}

  {% if custom_theme.navbar_dropdown_menu %}
  .navbar-nav .dropdown-menu {
    background-color: {{ custom_theme.navbar_dropdown_menu }};
    border-top: 1px solid {{ custom_theme.navbar_dropdown_menu }};
  }
  {% endif %}

  {% if custom_theme.navbar_dropdown_menu_text %}
  .navbar-nav .dropdown-menu a {
    color: {{ custom_theme.navbar_dropdown_menu_text }};
  }
  {% endif %}

  {% if custom_theme.navbar_dropdown_menu_hover %}
  .navbar-nav .dropdown-menu li a:hover {
    background-color: {{ custom_theme.navbar_dropdown_menu_hover }};
    color: {{ custom_theme.navbar_dropdown_menu_text }};
  }
  {% endif %}

  {% if custom_theme.navbar_dropdown_menu_divider %}
  .navbar-nav .dropdown-menu .divider {
    background-color: {{ custom_theme.navbar_dropdown_menu_divider }};
  }
  {% endif %}

  {% if custom_theme.logo %}
  .navbar-brand {
    background-image: url({{ custom_theme.logo.url }});
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }
  {% endif %}

  {% if custom_theme.textbox_bg_color %}
  .select2-container--default,
  .select2-selection--single,
  .select2-selection__rendered {
    background-color: {{ custom_theme.textbox_bg_color }};
  }
  {% endif %}

  {% if custom_theme.textbox_input_color %}
  .select2-container--default .select2-search--inline .select2-search__field {
    color: {{ custom_theme.textbox_input_color }} !important;
  }
  {% endif %}

  {% if custom_theme.jumbotron_color %}
  .home .jumbotron {
    background-color: {{ custom_theme.jumbotron_color }}
  }
  {% endif %}

  {% if custom_theme.jumbotron_title_color %}
  .home-content__main h3 {
    color: {{ custom_theme.jumbotron_title_color }}
  }
  .home-title__line {
    background-color: {{ custom_theme.jumbotron_title_color }} !important;
  }
  {% endif %}

  {% if custom_theme.jumbotron_description_color %}
  .home-content__main h1 {
    color: {{ custom_theme.jumbotron_description_color }} !important;
  }
  .jumbotron p,
  .jumbotron a {
    color: {{ custom_theme.jumbotron_description_color }} !important;
  }
  .search-field form input::placeholder,
  .search-field form input:-moz-placeholder,
  .search-field form input::-moz-placeholder,
  .search-field form input::-ms-input-placeholder,
  .search-field form input:-ms-input-placeholder {
    color: {{ custom_theme.jumbotron_description_color }} !important;
  }
  .search-field form input::placeholder {
    color: {{ custom_theme.jumbotron_description_color }} !important;
  }
  .btn-search>svg {
    fill: {{ custom_theme.jumbotron_description_color }} !important;
  }
  {% endif %}

  {% if custom_theme.jumbotron_welcome_hide %}
  .home .jumbotron .container {
    visibility: hidden;
  }
  {% endif %}

  {% if custom_theme.jumbotron_bg %}
  .home .jumbotron .container {
    position: relative;
    z-index: 1;
  }
  .home .jumbotron:after {
    content: "";
    background-image: url({{ custom_theme.jumbotron_bg.url }});
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    {% if not custom_theme.jumbotron_welcome_hide %}
    opacity: 0.5;
    {% endif %}
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    position: absolute;
    z-index: 0;
  }
  {% endif %}

  {% if custom_theme.search_bg_color or custom_theme.search_title_color %}
  .home .big-search {
    background: {{ custom_theme.search_bg_color }};
    color: {{ custom_theme.search_title_color }};
    padding-bottom: 3em;
    padding-top: 1em;
  }
  .home .big-search .btn-primary {
    background: transparent;
    border: none;
    color: {{ custom_theme.search_link_color }};
  }
  {% endif %}

  {% if custom_theme.copyright_color %}
  .footer-copyright {
    background-color: {{ custom_theme.copyright_color }};
  }
  {% endif %}

  {% if custom_theme.footer_bg_color or custom_theme.footer_text_color or custom_theme.footer_href_color %}
  footer {
    background-color: {{ custom_theme.footer_bg_color }};
    color: {{ custom_theme.footer_text_color }};
    padding: 0.5em;
  }
  footer a {
    color: {{ custom_theme.footer_href_color }};
  }
  {% endif %}
</style>
