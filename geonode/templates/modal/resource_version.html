{% load i18n %}
{% load static %}
{% load base_tags %}
{% load crispy_forms_tags %}

<div class="modal fade" id="resourceBaseVersioning" tabindex="-1" role="dialog" aria-labelledby="resourceBaseVersioning" aria-hidden="true">
  <form method="POST" class="mb-4 form-horizontal" id="resourcebase_versioning">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content rounded-0">
            <div class="modal-header bg-dark">
              <h3 class="text-white">Replace Datasets</h3>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <i class="fa-solid fa-xmark" data-dismiss="modal" style="color:white;"></i>
              </button>
            </div>
            <div class="modal-body">
              <p class="text-center">Would you like to record the information below about your updates on the Dataset?</p>
                {% csrf_token %}
                {{ version_form|crispy }}
            </div>
            <div class="modal-footer">
              <input type="submit" class="btn btn-save form-actions" value="Submit">
            </div>
        </div>
    </div>
  </form>
</div>
{% include "toast/resource_version.html" %}
