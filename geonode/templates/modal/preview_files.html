{% load i18n %}
{% load static %}

<script src="{% static "geonode/js/base/pdf.min.js" %}"></script>
<script src="{% static "geonode/js/base/pdf.worker.min.js" %}"></script>
<link href="{% static "geonode/css/pdf_viewer.css" %}" rel="stylesheet" />

<div class="modal fade previewDatasetFiles" id="previewDatasetFiles" tabindex="-1" role="dialog" aria-labelledby="previewDatasetFilesTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content rounded-0">
      <div class="modal-header">
        <h5 class="modal-title">Preview File</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <i class="fa-solid fa-xmark" data-dismiss="modal" title="Close Panel"></i>
        </button>
      </div>
      <div class="modal-body text-center">
          <div id="preview_file">
            <!-- handle with angularjs -->
          </div>
      </div>
      <div class="modal-footer">
        <a href="#" data-dismiss="modal" class="btn btn-secondary btn-block">Close</a>
      </div>
    </div>
  </div>
</div>
