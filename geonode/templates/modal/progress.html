{% load i18n %}

<div class="modal fade" id="progress" data-backdrop="static" data-keyboard="false" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="text-center">{% trans "Processing..." %}</h3>
            </div>
            <div class="modal-body">
                <div class="progress">
                  <div class="progress-bar bg-info progress-bar-striped active text-center" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="width:100%">
                    {% trans "Please wait... We are processing your request." %}
                  </div>
                </div>
            </div>
        </div>
    </div>
  </div>
