{% load i18n %}

<div class="modal fade removeDatasetFiles" id="removeDatasetFiles" tabindex="-1" role="dialog" aria-labelledby="removeDatasetFilesTitle" aria-hidden="true">
  <form id="remove_dfiles">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content rounded-0">
      <div class="modal-header">
        <h3 class="modal-title">{% trans "Delete Confirmation" %}</h3>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <i class="fa-solid fa-xmark" data-dismiss="modal" title="Close Panel"></i>
        </button>
      </div>
      <div class="modal-body text-center alert-danger">
        {% trans "Are you sure you want to remove all these files?" %}
      </div>
      <div class="modal-footer">
        <a href="#" data-dismiss="modal" class="btn btn-secondary">{% trans "Maybe later" %}</a>
        <button class="btn btn-danger" type="submit">{% trans "Yes, I am sure" %}</button>
      </div>
    </div>
  </div>
  </form>
</div>

{% block extra_script %}
<script type="text/javascript">
  $(document).ready(function(){

    $("#remove_dfiles").submit(function(t) {
      t.preventDefault();
      var ids = JSON.parse(window.localStorage.getItem('file_ids'));
      var deleteAllFilesMsg = `
        <div id="datasetToast" class="position-fixed bottom-0 right-0 p-3" style="z-index: 99999; right: 0; bottom: 0;">
          <div class="toast-message alert-error align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
              <strong class="mr-auto">Delete Files</strong>
              <small class="text-muted"></small>
              <button type="button" class="ml-2 mb-1 close" onclick="document.getElementById('datasetToast').remove()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="toast-body">
              <span class="font-lg-1">Your files has been deleted.</span>
            </div>
          </div>
        </div>
      `
      $.ajax({
          data: {ids: ids},
          url: "/api/v2/files/delete_files",
          type: 'DELETE',
          headers:{"X-CSRFToken":'{{csrf_token}}'},
          method: 'DELETE',
          success: function(result) {
              $(document.body).append(deleteAllFilesMsg);
              window.localStorage.removeItem('file_ids');
              setTimeout(function() {
                  $(".card-ingest").remove();
                  $('#removeDatasetFiles').modal('hide');
                  $("#datasetToast").remove();
              }, 1000);
          }
      }).done(function() {
          location.reload();
      });
    });
  });
</script>
{% endblock extra_script %}
