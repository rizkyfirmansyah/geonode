{% load i18n %}


<div class="modal fade" id="remove-incomplete-upload-modal" tabindex="-1" role="dialog" aria-labelledby="remove-incomplete-upload-modal-label">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="remove-incomplete-upload-modal-label">{% trans "Delete incomplete upload" %}</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <i class="fa-solid fa-xmark" data-dismiss="modal"></i>
        </button>
      </div>
      <div class="modal-body alert-danger text-center">
        {% trans "Are you sure you want to remove this incomplete upload?" %}
        <br/>
        {% trans "Name" %}: <span class="remove-incomplete-upload-modal-name"></span>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal">{% trans "No, don't remove it" %}</button>
        <button type="button" class="btn btn-danger remove-incomplete-upload-modal-button">{% trans "Yes, I am sure" %}</button>
      </div>
    </div>
  </div>
</div>
