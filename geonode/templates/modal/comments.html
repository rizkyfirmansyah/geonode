{% load dialogos_tags %}
{% load crispy_forms_tags %}
{% load i18n %}

{% if user.is_authenticated %}
  {% comment_form resource as form %}
  <div id="form_post_comment_div" class="modal fade" tabindex="-1" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">{% trans 'Add Comment' %}</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <i class="fa-solid fa-xmark" data-dismiss="modal"></i>
            </button>
          </div>
          <form action="{% comment_target resource %}" method="POST" id="form_post_comment">
            <div class="modal-body">
                {% csrf_token %}
                {{ form|crispy }}
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal" aria-hidden="true">{% trans "Cancel" %}</button>
                <button id="comment_submit_btn" class="btn btn-save">{% trans 'Submit Comment' %}</button>
            </div>
          </form>
        </div>
      </div>
  </div>
{% endif %}
