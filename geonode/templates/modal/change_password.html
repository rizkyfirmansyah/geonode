{% load i18n %}
{% load static from staticfiles %}
{% load base_tags %}

<div class="modal fade" id="changePassModal" tabindex="-1" role="dialog" aria-labelledby="changePassModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content rounded-0 m-modal-width">
          <div class="p-4 to-front">
              <div class="text-center">
                  <h3 class="light">Reset your password</h3>
                  <p class="mb-4 ">Please enter your email address below, and we'll authenticate to reset your password. </p>
                  <form method="POST" class="d-flex mb-4" id="change-password">
                    {% csrf_token %}x
                    <input id="id_oldpassword" type="password" name="oldpassword" autocomplete="current-password" class="form-control mr-3 x-input-space" placeholder="Current Password">
                    <input id="id_password1" type="password" name="password1" autocomplete="new-password" class="form-control mr-3 x-input-space" placeholder="New Password">
                    <input id="id_password2" type="password" name="password2" class="form-control mr-3 x-input-space" placeholder="Confirm Your Password">
                    <input type="submit" class="btn btn-primary form-actions" value="Submit">
                  </form>
                  <p class="mb-0 cancel l-space"><a href="#" data-dismiss="modal">Maybe later</a></p>
              </div>
          </div>
      </div>
  </div>
</div>

{% include 'toast/change_password.html' %}
