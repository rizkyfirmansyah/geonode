{% load i18n %}{% load static from staticfiles %}{% load base_tags %}<div class="modal fade" id="changePassModal" tabindex="-1" role="dialog" aria-labelledby="changePassModalTitle" aria-hidden="true"> <div class="modal-dialog modal-dialog-centered" role="document"> <div class="modal-content rounded-0 m-modal-width"> <div class="p-4 to-front"> <div class="text-center"> <h3 class="light">Reset your password</h3> <p class="mb-4 ">Please fill in the following information to change your password. </p><form method="POST" class="mb-4" id="change-password">{% csrf_token %}<div class="form-group mb-6"> <label class="" for="id_oldpassword">Current Password</label> <input id="id_oldpassword" type="password" name="oldpassword" autocomplete="current-password" class="form-control light-border m-input-space" placeholder="Current Password"> </div><div class="form-group mb-6"> <label class="" for="id_password1">New Password</label> <input id="id_password1" type="password" name="password1" autocomplete="new-password" class="form-control light-border m-input-space" placeholder="New Password"> </div><div class="form-group mb-6"> <label class="" for="id_password2">Confirm Password</label> <input id="id_password2" type="password" name="password2" class="form-control light-border m-input-space" placeholder="Confirm Your Password"> </div><input type="submit" class="btn btn-update form-actions" value="Submit"> </form> <p class="mb-0 cancel l-space"><a href="#" data-dismiss="modal">Maybe later</a></p></div></div></div></div></div>{% include 'toast/change_password.html' %}
