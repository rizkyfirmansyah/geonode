{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

<div class="modal fade" id="bulkMetadataForm" tabindex="-1" role="dialog" aria-labelledby="bulkEditMetadata" aria-hidden="true" ng-controller="CartList">
  <form method="post" id="bulk_metadata_form">
    {% csrf_token %}
    <div class="modal-dialog modal-dialog-bulk">
      <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="bulkEditMetadata">{% trans "Bulk Edit Metadata" %}</h3>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <i class="fa-solid fa-xmark" data-dismiss="modal"></i>
            </button>
        </div>
        <div class="modal-body">{{ bulk_metadata_form|crispy }}</div>
        <div class="modal-footer">
          <div class="row">
            <button class="btn btn-secondary mr-2" data-dismiss="modal">{% trans "Close" %}</button>
              {% verbatim %}<button ng-if="cart" class="btn btn-save" ng-click="bulk_metadata_submit($event)" id="bulk_metadata_submit" type="submit">{% endverbatim %}{% trans "Apply Changes" %}</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
