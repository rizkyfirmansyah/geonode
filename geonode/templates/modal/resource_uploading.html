{% load i18n %}
{% load base_tags %}

<div class="modal fade" style="width: 100%; height: 100%;" id="_resource_uploading" data-backdrop="static" data-keyboard="false" aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h1 class="text-center">{% trans "Uploading..." %}</h1>
          </div>
          <div class="modal-body">
              <div class="progress" id="prog-doc">
                <div class="progress-bar progress-bar-info progress-bar-striped active" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="width:0%">
                  {% if user.is_authenticated %}
                  {% with full_name=user.first_name|add:' '|add:user.last_name %}
                      Hi, {{ full_name }}! Grab your favourite snack, coffee, or tea while waiting :)
                  {% endwith %}
                  {% endif %}
                </div>
                <br><div class="remaining-text" id="remaining" style="text-align:center;width: 100%;"></div>
              </div>
          </div>
      </div>
  </div>
</div>
