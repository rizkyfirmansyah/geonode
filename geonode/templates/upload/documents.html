{% load i18n %}

<script type="text/javascript">
  $('#id_doc_file').on('change', function () {
    if ($('#id_title').val() == '') {
      var _text = $('#id_doc_file').val().replace("C:\\fakepath\\", "");
      $('#id_title').val(_text);
      $(this).prev('label').text(_text);
    }
  });

  $("#id_links").select2({
    width: '100%'
  });

  $('#upload_form').submit(function () {
    $('#permissions').val(JSON.stringify(permissionsString($('#permission_form'), 'base')));
  });

  $('#upload-button').click(function () {
    $('#_resource_uploading').modal('toggle');
  });
</script>
