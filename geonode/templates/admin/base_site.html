{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('SDI site admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header|default:_('SDI administration') }}</a></h1>
{% endblock %}

{% block extrahead %}
    <link href="{% static "geonode/css/bs4admin.css" %}" rel="stylesheet"/>
    <script src="{% static "lib/js/assets.min.js" %}"></script>
    <script>
        tinymce.init({
            selector: 'textarea#id_cookie_law_info_bar_text',
            theme: 'silver',
            plugins: ["print preview paste importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap hr pagebreak nonbreaking anchor toc insertdatetime advlist lists wordcount imagetools textpattern noneditable help charmap quickbars emoticons"],
            toolbar: ["undo redo | bold italic underline strikethrough | fontselect fontsizeselect formatselect | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview save | insertfile image media template link anchor codesample | ltr rtl"],
            toolbar_sticky: "true",
            content_css: '//www.tiny.cloud/css/codepen.min.css',
            toolbar_mode: 'sliding',
            contextmenu: "link image imagetools table",
            cleanup_on_startup : true
        });
        tinymce.init({
            selector: 'textarea#id_contents',
            theme: 'silver',
            height: "680",
            plugins: ["print preview paste importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap hr pagebreak nonbreaking anchor toc insertdatetime advlist lists wordcount imagetools textpattern noneditable help charmap quickbars emoticons"],
            toolbar: ["undo redo | bold italic underline strikethrough | fontselect fontsizeselect formatselect | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview save | insertfile image media template link anchor codesample | ltr rtl"],
            toolbar_sticky: "true",
            content_css: '//www.tiny.cloud/css/codepen.min.css',
            toolbar_mode: 'sliding',
            contextmenu: "link image imagetools table",
            cleanup_on_startup : true
        });
    </script>
    <style type="text/css">
        #grp-content {
            position: relative;
            float: left;
            clear: both;
            padding: 100px 20px 120px;
            width: 100%;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }
    </style>
{% endblock %}
