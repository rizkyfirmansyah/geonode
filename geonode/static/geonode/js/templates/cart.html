<div id="composerCart" class="card p-2">
  <div
    class="card-header text-center font-lg-1"
    ng-bind="(selectedString)"></div>
  <div
    ng-show="!cart.getCart().items.length"
    class="card-body">
    <h5 class="text-muted">{{ emptyString }}</h5>
  </div>
  <ul class="list-group">
    <div class="" ng-click="cart.removeAll()" ng-if="cart.getCart().items.length >= 2"><button class="btn btn-danger btn-block">Remove all selected</button></div>
    <li class="list-group-item clearfix" ng-if="resource && resource.title" ng-repeat="resource in cart.getCart().items">{{ resource.title | limitTo: 25}}{{ resource.title.length > 25 ? '...' : '' }}<button class="btn btn-primary btn-xs float-right" ng-click="cart.removeItem(resource)"><i class="fa-solid fa-remove fa-lg"></i></button></li>
  </ul>
</div>
