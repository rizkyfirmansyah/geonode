<div class="card-header">
  <div class="row">
    <h5 class="col">{{ datasets.length }} Files</h5>
    <a data-toggle="modal" class="btn btn-danger mr-4" data-target="#removeDatasetFiles" style="cursor: pointer;"><i class="fa-solid fa-trash" title="Delete All Files"></i></a>
  </div>
</div>

<div class="card" id="card-dataset">
  <div ng-repeat="file in datasets" class="card-body border" id="card-{{ file.id }}">
      <div class="row">
        <div class="col-md-10 align-self-center">
          <div ng-if="file.hash">
            <span class="text-muted small">SHA-256: {{ file.hash }} - {{ file.file_size | humanFileSize }}</span>
          </div>
          <div ng-if="!file.hash">
            <span class="badge badge-info d-inline">External Dataset</span>
          </div>
        </div>
        <div class="col-md-2">
            <div class="d-flex flex-row float-right">
              <div ng-if="file.hash" class="align-self-center mr-3"><span class="badge badge-secondary d-inline">{{ file.extension }}</span></div>
              <div ng-if="file.hash"><a ng-click="preview_file(file.extension, file.id, file.file_type)" class="btn btn-primary mr-3 preview-file" data-target="#previewDatasetFiles" style="cursor: pointer;" data-value="{{ file.id }}" data-extension="{{ file.extension }}"><i class="fa-solid fa-folder-open" title="Preview File"></i></a></div>
              <button class="btn btn-warning" style="cursor: pointer;" ng-click="delete_file(file.id)"><i class="fa-solid fa-trash" title="Delete File"></i></button>
            </div>
        </div>
      </div>
      <div class="row">
        <input class="file_id" type="hidden" name="id" value="{{ file.id }}">
        <div class="col-md-2 mt-2">
            <span><label for="file_name">File Name</label></span></br/>
        </div>
        <div class="col-md-10 mt-2">
            <input class="w-100 form-control file_name" type="text" name="file_name" aria-disabled="false" value="{{ file.file_name }}">
        </div>
        <div class="col-md-2 mt-2" ng-if="file.file_url">
            <span><label for="file_url">URL File</label></span></br/>
        </div>
        <div class="col-md-10 mt-2" ng-if="file.file_url">
            <input class="w-100 form-control file_url" type="text" name="file_url" aria-disabled="false" value="{{ file.file_url }}">
        </div>
            <input class="file_url" type="hidden" name="file_url" aria-disabled="false" value="" ng-if="!file.file_url">
        <div class="col-md-2 mt-2">
            <span><label for="file_description">Description</label></span>
        </div>
        <div class="col-md-10 mt-2">
            <textarea name="file_description" rows="3" class="textarea form-control d-inline-flex w-100 file_description" required="">{{ file.file_description }}</textarea>
        </div>
        <div class="col-md-2 mt-2">
            <span><label for="file_data_quality">Data Quality</label></span>
        </div>
        <div class="col-md-10 mt-2">
            <textarea name="file_data_quality" rows="3" class="textarea form-control d-inline-flex w-100 file_data_quality" required="">{{ file.file_data_quality }}</textarea>
        </div>
        <!-- <div class="col-md-2 mt-2">
            <span><label for="file_keywords">Tags</label></span>
        </div>
        <div class="col-md-10 mt-2">
            <input class="w-100 form-control file_keywords" type="text" name="file_keywords" aria-disabled="false">
            <small id="hint_id_keywords" class="form-text text-muted">A space or comma-separated list of keywords</small>
        </div> -->
      </div>
  </div>
</div>

<div class="card-footer">
  <button type="submit" class="btn btn-upload btn-block" ng-click="upload_datasets($event)" id="upload_form">Upload Datasets</button>
</div>
