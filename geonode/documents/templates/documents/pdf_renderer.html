{% load i18n %}
{% load base_tags %}
{% load document_tags %}
{% load static %}

<script src="{% static "geonode/js/base/pdf.min.js" %}"></script>
<script src="{% static "geonode/js/base/pdf.worker.min.js" %}"></script>
<link href="{% static "geonode/css/pdf_viewer.css" %}" rel="stylesheet" />

{% block pdf_renderer %}
  <canvas id="pdf_renderer" class="w-100"></canvas>
  <div class="row justify-content-center mt-2">
      <div id="prev" class="btn btn-light mr-4"><i class="fa-solid fa-angle-left"></i></div>
      <div>
        <input id="current_page" value="1" type="text" class="btn btn-light text-center mr-3" style="width: 60px; border: 1px solid var(--shadow-1) !important;">
        <span> / <span id="page_count"></span> </span>
      </div>
      <div id="next" class="btn btn-light ml-4"><i class="fa-solid fa-angle-right"></i></div>
      <!-- <div id="zoomIn" class="btn btn-light ml-4"><i class="fa-solid fa-magnifying-glass-plus"></i></div> -->
      <!-- <div id="zoom_out" class="btn btn-light ml-4"><i class="fa-solid fa-magnifying-glass-minus"></i></div> -->
  </div>
{% endblock  %}

{% block extra_script %}

  <script type="text/javascript">
      $(function() {

          // ref https://mozilla.github.io/pdf.js/examples/index.html#interactive-examples
          var url = "{% url "document_download" resource.id %}";
          
          var pdfDoc = null,
              pageNum = 1,
              pageRendering = false,
              pageNumPending = null,
              zoom = 1,
              scale = 0.8,
              canvas = document.getElementById('pdf_renderer'),
              ctx = canvas.getContext('2d');

          /**
            * Get page info from document, resize canvas accordingly, and render page.
            * @param num Page number.
            */
          function renderPage(num) {
              pageRendering = true;
              // Using promise to fetch the page
              pdfDoc.getPage(num).then(function(page) {
                  var viewport = page.getViewport({scale: scale});
                  canvas.height = viewport.height;
                  canvas.width = viewport.width;

                  // Render PDF page into canvas context
                  var renderContext = {
                      canvasContext: ctx,
                      viewport: viewport
                  };
                  var renderTask = page.render(renderContext);

                  // Wait for rendering to finish
                  renderTask.promise.then(function() {
                      pageRendering = false;
                      if (pageNumPending !== null) {
                          // New page rendering is pending
                          renderPage(pageNumPending);
                          pageNumPending = null;
                      }
                  });
              });

              // Update page counters
              document.getElementById('current_page').value = num;
          }

          /**
            * If another page rendering in progress, waits until the rendering is
            * finised. Otherwise, executes rendering immediately.
            */
          function queueRenderPage(num) {
              if (pageRendering) {
                  pageNumPending = num;
              } else {
                  renderPage(num);
              }
          }

          /**
            * Jump to page.
            */
          function onJumpPage() {
            if (pdfDoc == null) return;
            
            var e = window.event;
            var code = (e.keyCode ? e.keyCode : e.which);

            // check if key code matches the Enter key
            if(code == 13) {
              var desiredPage = $("#current_page").val();
              if(desiredPage >= 1 && desiredPage <= pdfDoc.numPages) {
                  pageNum = parseInt(desiredPage);
                  queueRenderPage(pageNum)
                  document.getElementById("current_page").value = desiredPage;
              }
            }
          }
          document.getElementById('current_page').addEventListener('keypress', onJumpPage);
          

          /**
            * Displays previous page.
            */
          function onPrevPage() {
              if (pageNum <= 1) {
                  return;
              }
              pageNum--;
              queueRenderPage(pageNum);
          }
          document.getElementById('prev').addEventListener('click', onPrevPage);

          /**
            * Displays next page.
            */
          function onNextPage() {
            if (pageNum >= pdfDoc.numPages) {
              return;
            }
            pageNum++;
            queueRenderPage(pageNum);
          }
          document.getElementById('next').addEventListener('click', onNextPage);

          /**
            * Zoom in PDF.
            */
          function zoomIn() {
              if(pdfDoc == null) return;

              scale += zoom;
              var num = parseInt($("#current_page").val());
              console.log("scale ", scale, "num ", num, "pageRendering ", pageRendering)
              
              queueRenderPage(num);
          }
          // document.getElementById('zoom_in').addEventListener('click', zoomIn);


          /**
            * Zoom out PDF.
            */
            function zoomOut() {
              if(pdfDoc == null) return;

              scale -= 0.5;
              var num = parseInt($("#current_page").val());
              queueRenderPage(num);
          }
          // document.getElementById('zoom_out').addEventListener('click', zoomOut);

          /**
            * Asynchronously downloads PDF.
            */
          pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
              pdfDoc = pdfDoc_;
              document.getElementById('page_count').textContent = pdfDoc.numPages;

              // Initial/first page rendering
              renderPage(pageNum);
          });

      });

  </script>
{% endblock extra_script %}
