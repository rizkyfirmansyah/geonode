version: '3.5'
services:

  data-dir-conf:
    image: geonode/geoserver_data:2.23.x
    restart: on-failure
    container_name: gsconf4${COMPOSE_PROJECT_NAME}
    labels:
        org.geonode.component: conf
        org.geonode.instance.name: geonode
    command: /bin/true
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    env_file:
      - ./scripts/docker/env/${DOCKER_ENV}/geoserver.env
    networks:
      - geonode

  geoserver:
    image: geonode/geoserver:2.23.x
    restart: unless-stopped
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    stdin_open: true
    # tty: true
    labels:
        org.geonode.component: geoserver
        org.geonode.instance.name: geonode
    depends_on:
      - data-dir-conf
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    env_file:
      - ./scripts/docker/env/${DOCKER_ENV}/geoserver.env
    ports:
      - "${GEOSERVER_SERVER_PORT}:8080"
    networks:
      - geonode

  db:
    image: kartoza/postgis:14-3.1
    container_name: dbspatial4${COMPOSE_PROJECT_NAME}
    env_file: 
      - ./scripts/docker/env/${DOCKER_ENV}/db/gis/gis.env
    volumes:
      - dbspatial:/var/lib/postgresql
    restart: on-failure
    ports:
      - "0.0.0.0:25432:5432"
    networks:
      - geonode

volumes:
  dbspatial:
    name: ${COMPOSE_PROJECT_NAME}-dbspatial
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir

networks:
  geonode:
    name: geonode