version: '3.4'
services:

# Common Django template for Geonode, Celery services below
x-common-django:
  &default-common-django
  image: geonode/geonode:latest
  restart: on-failure
  env_file:
    - .env
  volumes:
    - statics:/mnt/volumes/statics
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
    - geonode:/usr/src/geonode/geonode
    - geoserver-data-dir:/geoserver_data/data

services:

  # Vanilla RabbitMQ service. This is needed by celery
  rabbitmq:
    image: rabbitmq:3.7-alpine
    container_name: rabbitmq4${COMPOSE_PROJECT_NAME}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.sh:/docker-entrypoint-initdb.d/init.sh
    restart: on-failure
    # ports:
    #   - "127.0.0.1:5672:5672"
    #   - "127.0.0.1:15672:15672"

  # Our custom django application. It includes Geonode.
  django:
    << : *default-common-django
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://127.0.0.1:8001/"
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 60s
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/geonode/uwsgi.ini"
    # ports:
    #   - "127.0.0.1:8000:8000"

  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    image: geonode/geonode:latest
    container_name: celery4${COMPOSE_PROJECT_NAME}
    depends_on: 
      - django
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "celery-cmd"
    links:
      - rabbitmq

  geoserver:
    image: geonode/geoserver:2.19.x
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://127.0.0.1:8080/geoserver/rest/workspaces/sdi.html"
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 60s
    env_file:
      - ./scripts/docker/env/${DOCKER_ENV}/geoserver.env
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8080"

  data-dir-conf:
    image: geonode/geoserver_data:2.19.x
    container_name: gsconf4${COMPOSE_PROJECT_NAME}
    command: /bin/true
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    restart: on-failure

  db:
    image: kartoza/postgis:13-3.1
    container_name: dbspatial4${COMPOSE_PROJECT_NAME}
    env_file: 
      - ./scripts/docker/env/${DOCKER_ENV}/db.env
    volumes:
      - dbspatial:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: on-failure
    # uncomment to enable remote connections to postgres
    # ports:
    #   - "35432:5432"

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  geonode:
    name: ${COMPOSE_PROJECT_NAME}-geonode
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  rabbitmq:
    name: ${COMPOSE_PROJECT_NAME}-rabbitmq
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  dbspatial:
    name: ${COMPOSE_PROJECT_NAME}-dbspatial
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
